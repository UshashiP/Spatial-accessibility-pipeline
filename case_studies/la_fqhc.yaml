# Spatial Accessibility Pipeline — Los Angeles FQHCs
# Data source: HRSA Health Center Service Delivery Sites
# Run: python run_pipeline.py --config case_studies/la_fqhc.yaml
#
# Setup:
#   1. python scripts/acquire_la_data.py   (run once: all LA County blocks)
#   2. python scripts/acquire_acs.py --config case_studies/la_fqhc.yaml \
#        --blocks data/intermediate_files/blocks_Los_Angeles.shp \
#        --out data/intermediate_files/blocks_Los_Angeles_county_enhanced.shp

study_area:
  name: "City of Los Angeles"
  state_fips: "06"
  state_abbrev: "CA"
  county_fips: ["037"]
  coordinate_system: "EPSG:32611"   # UTM Zone 11N (metres)
  distance_unit: "meters"
  # Mainland LA County; the southern edge (33.70°N) leaves out Catalina and
  # San Clemente Islands, which cannot reach a mainland facility.
  bbox: [-118.9448, 33.7037, -117.6464, 34.8233]
  # The model runs on all of LA County — residents and clinics across the city line
  # serve and compete with each other (the city surrounds Beverly Hills, Santa
  # Monica, Culver City...) — but statistics, maps and the dashboard report the
  # City of Los Angeles (Census place 0644000), matching DC and NYC as cities.
  report_area:
    boundary: "data/reference/places/tl_2020_06_place.zip"
    url: "https://www2.census.gov/geo/tiger/TIGER2020/PLACE/tl_2020_06_place.zip"
    id_column: "GEOID"
    id: "0644000"

facility:
  type: "FQHC"
  label: "Federally Qualified Health Centers"
  cms_dataset_id: ""
  cms_category_code: ""
  supply_column: "supply"
  supply_label: "FQHC sites"

census:
  base_url: "https://api.census.gov/data"
  year: 2020
  dataset: "dec/pl"
  variables:
    total_population: "P1_001N"
  geography: "block"

cms:
  base_url: "https://data.hrsa.gov/DataDownload/DD_Files"

analysis:
  distance_threshold_m: 1600   # 1.6km (~20 min walk) — LA is car-dependent
  decay_function: "gaussian"
  population_column: "population"
  method_label: "SDW-2SFCA"

s3:
  prefix: "healthcare-accessibility"
  bronze: "bronze"
  silver: "silver"
  gold: "gold"
  region: "us-east-1"
  geoparquet_compression: "snappy"

duckdb:
  db_path: "outputs/results/la_fqhc_accessibility.duckdb"
  gold_table: "accessibility_scores"

data:
  snapshot:
    use_snapshot: true
  local_shapefiles:
    # Every HRSA health center and look-alike site in LA County (FIPS 06037), built by
    # scripts/acquire_la_data.py with no geographic clipping.
    facilities: "data/intermediate_files/FQHC_LA_county.shp"
    # All mainland LA County blocks with ACS income, insurance and age columns
    # apportioned from tracts by block population, as for DC; built by
    # scripts/acquire_la_data.py then scripts/acquire_acs.py.
    census_blocks: "data/intermediate_files/blocks_Los_Angeles_county_enhanced.shp"
  population_column: "population"
  # Blocks with no residents keep population 0: no demand, left out of statistics.
  empty_blocks: "exclude"
  intermediate:
    path: "data/intermediate_files/"
  output:
    results: "outputs/results/"
    figures: "outputs/figures/"

validation:
  min_population: 0
  max_population: 100000
  min_supply: 1
  max_supply: 500
  required_facility_columns: ["geometry", "supply"]
  required_population_columns: ["geometry", "population"]
  max_null_pct: 0.05

visualization:
  figure_dpi: 300
  figure_size: [12, 10]
  colormap: "RdYlBu"     # different colormap from DC/NYC for visual distinction
  save_format: "png"
  vmax_percentile: 95

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/la_pipeline.log"
  console_output: true
