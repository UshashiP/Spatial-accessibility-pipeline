# Spatial Accessibility Pipeline — NYC Dialysis Centers
# Data source: NYC Facilities Database (FacDB) via NYC Open Data
# Run: python run_pipeline.py --config configs/nyc_dialysis.yaml
#
# Setup:
#   1. python scripts/acquire_nyc_data.py   (run once)
#   2. Set use_snapshot: true below

# ── Study Area ──────────────────────────────────────────────────────────────
study_area:
  name: "New York City"
  state_fips: "36"
  state_abbrev: "NY"
  coordinate_system: "EPSG:32618"   # NYC UTM Zone 18N (metres)
  distance_unit: "meters"

# ── Facility ────────────────────────────────────────────────────────────────
facility:
  type: "Dialysis"
  label: "Dialysis Centers"
  cms_dataset_id: "ji82-xba5"       # NYC FacDB dataset ID
  cms_category_code: ""             # Not used — FacDB uses different filter
  supply_column: "supply"           # normalised to 1 per facility (FacDB)
  supply_label: "Dialysis facilities"

# ── Census API ──────────────────────────────────────────────────────────────
census:
  base_url: "https://api.census.gov/data"
  year: 2020
  dataset: "dec/pl"
  variables:
    total_population: "P1_001N"
  geography: "block"

# ── CMS API ─────────────────────────────────────────────────────────────────
cms:
  base_url: "https://data.cityofnewyork.us/resource"

# ── 2SFCA Parameters ────────────────────────────────────────────────────────
analysis:
  distance_threshold_m: 1200   # 1.2km — larger catchment for NYC density
  decay_function: "gaussian"
  population_column: "population"
  method_label: "Enhanced 2SFCA"

# ── AWS S3 ──────────────────────────────────────────────────────────────────
s3:
  prefix: "spatial-accessibility"
  bronze: "bronze"
  silver: "silver"
  gold: "gold"
  region: "us-east-1"
  geoparquet_compression: "snappy"

# ── DuckDB ──────────────────────────────────────────────────────────────────
duckdb:
  db_path: "outputs/results/nyc_dialysis_accessibility.duckdb"
  gold_table: "accessibility_scores"

# ── Data Paths ───────────────────────────────────────────────────────────────
data:
  snapshot:
    use_snapshot: true
  local_shapefiles:
    facilities:    "data/intermediate_files/Dialysis_NYC.shp"
    census_blocks: "data/intermediate_files/blocks_New_York_City_enhanced.shp"
  population_column: "population"
  intermediate:
    path: "data/intermediate_files/"
  output:
    results: "outputs/results/"
    figures: "outputs/figures/"

# ── Validation ───────────────────────────────────────────────────────────────
validation:
  min_population: 0
  max_population: 100000
  min_supply: 1
  max_supply: 500
  required_facility_columns: ["geometry", "supply"]
  required_population_columns: ["geometry", "population"]
  max_null_pct: 0.05

# ── Visualization ─────────────────────────────────────────────────────────────
visualization:
  figure_dpi: 300
  figure_size: [12, 10]
  colormap: "RdYlBu"
  save_format: "png"
  vmax_percentile: 95    # clip colorscale at 95th percentile

# ── Logging ──────────────────────────────────────────────────────────────────
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/nyc_pipeline.log"
  console_output: true
